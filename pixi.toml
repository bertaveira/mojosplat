[workspace]
name = "mojosplat"
version = "0.1.0"
description = "3D Gaussian Splatting kernels in Mojo"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

# --- Core: pure Mojo, no Python needed -------------------------------------
[dependencies]
mojo = "==1.2.0"
# MAX runtime: provides the `max.gpu` Mojo package and libmax (GPU driver layer)
max-core = "==26.7.0"

[tasks]
test = { cmd = "bash scripts/run_mojo_tests.sh", description = "Run the pure-Mojo test-suite" }
render = { cmd = "mojo run -I . examples/render_splat.mojo", description = "Render a .splat file to an image" }
bench = { cmd = "mojo run -I . examples/benchmark.mojo", description = "Benchmark the render pipeline" }
fmt = "mojo format mojosplat tests examples bindings"
