[workspace]
name = "mojosplat"
version = "0.1.0"
description = "3D Gaussian Splatting kernels in Mojo"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# --- Core: pure Mojo, no Python needed -------------------------------------
[dependencies]
mojo = "==1.2.0"
# MAX runtime: provides the `max.gpu` Mojo package and libmax (GPU driver layer)
max-core = "==26.7.0"
libjpeg-turbo = ">=3.1"

[tasks]
test = { cmd = "bash scripts/run_mojo_tests.sh", description = "Run the pure-Mojo test-suite" }
render = { cmd = "mojo run -I . tools/render.mojo", description = "Render a .splat file to an image" }
bench = { cmd = "mojo run -I . tools/bench.mojo", description = "Benchmark the rasterizer" }
train = { cmd = "mojo run -I . tools/train.mojo", description = "Train a 3DGS model on a COLMAP scene" }
eval = { cmd = "mojo run -I . tools/eval.mojo", description = "Evaluate a trained model on the held-out views" }
fmt = "mojo format mojosplat tests tools bindings"

# --- Optional: PyTorch bindings (torch lives only in this environment) -----
# Linux only: gsplat (the reference) needs CUDA.
[feature.torch]
platforms = ["linux-64"]

[feature.torch.dependencies]
python = "3.12.*"

[feature.torch.pypi-dependencies]
torch = ">=2.9.0"
numpy = "*"
pytest = ">=8"
pillow = "*"
viser = ">=1.0.24"
gsplat = { git = "https://github.com/bertaveira/gsplat.git" }
mojosplat-torch = { path = "bindings/torch", editable = true }

[feature.torch.tasks]
build-ext = { cmd = "mojo build -I . bindings/torch/src/_mojosplat.mojo --emit shared-lib -o bindings/torch/mojosplat_torch/_mojosplat.so", description = "Build the Mojo Python extension", inputs = ["mojosplat/**/*.mojo", "bindings/torch/src/*.mojo"], outputs = ["bindings/torch/mojosplat_torch/_mojosplat.so"] }
test-torch = { cmd = "pytest bindings/torch/tests -q", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" }, depends-on = ["build-ext"], description = "Run the PyTorch binding tests (vs gsplat)" }

[environments]
torch = ["torch"]
